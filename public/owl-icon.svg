<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <!-- Owl head outline -->
  <polygon points="50,10 20,35 15,60 30,80 50,85 70,80 85,60 80,35" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Owl ears -->
  <polygon points="50,10 35,25 50,20" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="50,10 65,25 50,20" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left eye -->
  <circle cx="35" cy="45" r="10" fill="none" stroke="#0891b2" stroke-width="2"/>
  <circle cx="35" cy="45" r="4" fill="url(#eyeGlow)"/>
  <!-- Right eye -->
  <circle cx="65" cy="45" r="10" fill="none" stroke="#10b981" stroke-width="2"/>
  <circle cx="65" cy="45" r="4" fill="url(#eyeGlow)"/>
  <!-- Beak -->
  <polygon points="50,55 45,65 50,70 55,65" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
</svg>


